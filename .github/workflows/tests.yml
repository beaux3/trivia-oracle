# Runs the whole suite on every pull request and on every push to main. Branch protection on main
# requires the "tests" check to pass before a pull request can be merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Builds both images and runs every test group in them (see AGENTS.md, "Docker").
      - run: python3 scripts/run_tests.py
